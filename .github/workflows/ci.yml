# CI gate (D-010, D-028): every PR and every push to main must pass both jobs.
# Branch protection on main requires the two job names below. Renaming a job
# means updating the protection rule too, or merges will wait forever.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, architecture tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings as errors)
        run: dotnet build FitnessCenter.sln -warnaserror

      # Fails when a module's data model changed without a new migration.
      - name: Migrations are up to date
        run: |
          dotnet tool restore
          for dir in src/Modules/*/; do
            module=$(basename "$dir")
            echo "::group::$module"
            dotnet ef migrations has-pending-model-changes --no-build \
              --project "src/Modules/$module/$module" --context "${module}DbContext"
            echo "::endgroup::"
          done

      # Integration tests start PostgreSQL with Testcontainers; ubuntu runners have Docker.
      - name: Test (architecture, integration)
        run: dotnet test FitnessCenter.sln --no-build

  frontend:
    name: Frontend (lint, typecheck, unit, unused code, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Unused code (Knip)
        run: bun run knip

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
