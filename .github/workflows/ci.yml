# CI gate (D-010, D-028): every PR and every push to main must pass both jobs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, architecture tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings as errors)
        run: dotnet build FitnessCenter.sln -warnaserror

      - name: Test
        run: dotnet test FitnessCenter.sln --no-build

  frontend:
    name: Frontend (lint, typecheck, unit, unused code, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Unused code (Knip)
        run: bun run knip

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
