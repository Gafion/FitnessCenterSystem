# CI gate (D-010, D-028): every PR and every push to main must pass the backend and
# frontend jobs. Branch protection on main requires those two job names; the
# full-stack E2E job (D-043) is not a required check. Renaming a job
# means updating the protection rule too, or merges will wait forever.
# A pull request that changes only .md files skips the test jobs (D-045). GitHub
# reports a job skipped by its `if:` as passing, so such a PR stays mergeable.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the test jobs run (D-045). Only a pull request whose every
  # changed file is *.md skips them. Pushes to main always run everything, so
  # main is fully checked after each merge whatever the diff looks like.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A pull_request run checks out the PR's merge commit, so HEAD^1 is the
      # base branch and the diff is exactly what the PR would change.
      - name: Any changed file other than .md?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          # An empty diff also counts as code: when in doubt, run the tests.
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv '\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (build, tests, architecture tests)
    needs: changes
    # Runs unless the changes job positively says docs-only. If that job fails,
    # its output is empty and the tests still run (`!cancelled()` overrides the
    # default skip on a failed need, which would otherwise count as passing).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings as errors)
        run: dotnet build FitnessCenter.sln -warnaserror

      # Fails when a module's data model changed without a new migration.
      # The build writes the API's OpenAPI document (D-033). A diff means an endpoint
      # changed without the committed document, and so the frontend client, following.
      - name: OpenAPI document is up to date
        run: |
          if [ -n "$(git status --porcelain frontend/src/api)" ]; then
            git status --porcelain frontend/src/api
            git diff frontend/src/api
            echo "::error::Build the backend, run 'bun run --cwd frontend api:generate' and commit frontend/src/api."
            exit 1
          fi

      - name: Migrations are up to date
        run: |
          dotnet tool restore
          for dir in src/Modules/*/; do
            module=$(basename "$dir")
            echo "::group::$module"
            dotnet ef migrations has-pending-model-changes --no-build \
              --project "src/Modules/$module/$module" --context "${module}DbContext"
            echo "::endgroup::"
          done

      # Integration tests start PostgreSQL with Testcontainers; ubuntu runners have Docker.
      - name: Test (architecture, integration)
        run: dotnet test FitnessCenter.sln --no-build

  frontend:
    name: Frontend (lint, typecheck, unit, unused code, E2E)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Rule 6: frontend/src/api is generated, never hand-edited (D-028, D-033).
      - name: Generated API client matches the OpenAPI document
        run: |
          bun run api:generate
          if [ -n "$(git status --porcelain src/api)" ]; then
            git diff src/api
            echo "::error::frontend/src/api differs from what the generator writes. Run 'bun run --cwd frontend api:generate' and commit; don't hand-edit it."
            exit 1
          fi

      - name: Lint and format (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Unused code (Knip)
        run: bun run knip

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: bun run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # D-043: a few key flows against the real API, PostgreSQL and Mailpit. Not a required
  # check (branch protection is the owner's call). It needs only the docs-only check,
  # with the same condition as the backend and frontend jobs.
  full-stack-e2e:
    name: Full-stack E2E
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The same images as Aspire and the integration tests.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitnesscenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
          - 8025:8025
    env:
      API_URL: http://localhost:5398
      E2E_BASE_URL: http://localhost:4173
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install frontend
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Build API
        run: dotnet build src/FitnessCenter.Api

      # Development: migrates the database and seeds the synthetic class schedule at
      # startup. No Google client ID, so email/password only.
      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: ${{ env.API_URL }}
          ConnectionStrings__fitnesscenter: Host=localhost;Port=5432;Database=fitnesscenter;Username=postgres;Password=postgres
          Email__Smtp__Host: localhost
          Email__Smtp__Port: '1025'
        run: |
          nohup dotnet run --project src/FitnessCenter.Api --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$API_URL/health" > /dev/null && exit 0
            sleep 2
          done
          cat api.log
          echo "::error::The API did not become healthy."
          exit 1

      # vite preview serves the built SPA and proxies /api to the API (vite.config.ts).
      - name: Build and serve frontend
        working-directory: frontend
        env:
          API_HTTP: ${{ env.API_URL }}
        run: |
          bun run build
          nohup bun run preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$E2E_BASE_URL" > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          echo "::error::The frontend did not start."
          exit 1

      - name: Full-stack E2E tests (Playwright)
        working-directory: frontend
        run: bun run e2e:full

      - name: Upload Playwright report and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-full-stack
          path: |
            frontend/playwright-report/full
            frontend/test-results/full
            api.log
            frontend/preview.log
          retention-days: 7
